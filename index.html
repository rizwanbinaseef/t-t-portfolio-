  /* header, the way Sites lays it out: name left, pages right */
  .top{position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:1px solid var(--rule)}

  .top a.nav{text-decoration:none; color:var(--ink); font-size:1rem; padding:.25rem 0; border-bottom:2px solid transparent}
  .top a.nav.on{border-bottom-color:var(--pen); color:var(--pen)}

  h1{font-size:clamp(2rem,6vw,3rem); font-weight:600; line-height:1.15; margin:1.2rem 0 1rem; color:var(--ink)}

  .label{font-size:1.05rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin:2.6rem 0 .8rem}
  p{margin:0 0 1.1em}
  .soft{color:var(--ink-soft)}
  .small{font-size:.95rem}
  .note{font-style:italic; color:var(--ink-soft); font-size:.95rem}
  hr{border:0; border-top:1px solid var(--rule); margin:2.4rem 0}

  .pen{font-family:"Caveat","Segoe Print","Bradley Hand",cursive; color:var(--pen); font-size:1.35rem; line-height:1.2; font-weight:500}

  .areas li{padding:.55rem 0; border-bottom:1px solid var(--rule); font-size:1.25rem}

  .foot{border-top:1px solid var(--rule); margin-top:3rem; padding-top:1.2rem; font-size:.95rem; color:var(--ink-soft)}
  .prevnext{display:flex; justify-content:space-between; gap:1rem; margin-top:2.5rem}
  .prevnext a{text-decoration:none; color:var(--pen); font-weight:600}

const READINGS = [
  {
    id:"young", drive:"https://drive.google.com/file/d/1zmedbnG9DMFbiLrlvT9SZqKKxzNw_1yc/view",

    note:"where the discipline of English came from, and what it asks of a first-year",
    what:"This is a chapter from a guide written for people in exactly my position, first-year English students who arrived expecting one thing and were handed another. Young goes through how English Literature became a subject you could take a degree in, Richards and practical criticism at Cambridge in the 1920s, the Leavises deciding which books were civilising and which were not, and then the wave of theory from the seventies onwards that changed the questions completely. It ends with a first-year student called Tracey Tingey writing about what her Ways of Reading module did to her, which is the part I keep going back to.",
    passages:[
      {text:"Young starts with practical criticism: the poem on the page, nothing else in the room, and the belief that if you looked hard enough at the technique you'd arrive at an objective judgement of whether it was any good.", pen:"attacks this head on"},
      {text:"The word canon, she points out, comes from the church's list of texts that were supposed to inspire revelation. The literary canon borrowed that authority, and used it to write off genre fiction as a “drug habit” (Q. D. Leavis's phrase).", pen:"Literary Canon"},
      {text:"Cultural studies changed the question. Not “is this good?” but “how has this been read, and who decided?” Books as products of ideology and producers of it.", pen:"Books are understood as products of and producers of ideology."},

    ],
    response:"I will be honest, I came in thinking that the job was to say whether a book was good and then defend that well. This chapter told me that particular question had been retired before my parents were born. What I actually found difficult was not the long list of theories, it was the paradox Young points out near the end, that I am expected to drop my own voice and pick up an academic one, but the one thing that gets you thrown out of a university is losing your own voice completely (plagiarism, in other words). I still do not fully know where the line between the two is, and I have started to think that not knowing might be the point. The one place I pushed back was where she says that simply liking a book is no longer enough. Fine, but it is still where every reading I have ever done started, and I do not think the course wants me to pretend otherwise.",
    slot:""
  },
  {
    id:"viswanathan", drive:"https://drive.google.com/file/d/1fJp8943yt0_OxzX3XgQFv85wLmG7VcPA/view",
    author:"Gauri Viswanathan",
    title:"Introduction, from The Masks of Conquest",
    year:"Oxford University Press, 1989, pp. 1–21",
    note:"English literature as a way of ruling, before it was a subject",
    what:"The reading is the Introduction to Viswanathan's book. Her argument is that English literary study was institutionalised in India before it was a proper subject in England, and that it was put there to do a job. Working from Gramsci, she treats cultural domination as something that operates by consent and can come before conquest by force, and she reads British educational policy in India as the record of exactly that. The chapter is largely an argument with other historians of Indian education, who in her view credit the British with an accidental generosity they did not have.",
    passages:[
      {text:"Drawing on Gramsci, she takes cultural domination to work by consent and to precede conquest by force, with the supremacy of a group showing itself both as domination and as intellectual and moral leadership.", pen:"Hegemony: when a minority rules the majority, usually through consent or coercion, sometimes both. Manufactured consent."},
      {text:"She quotes a minute issued in the Bombay Presidency by J. Farish, which states that the natives must either be kept down by a sense of British power or brought to submit willingly, out of a conviction that the British are wiser, more just and more humane than any other rulers they might have.", pen:"This paper looks at how the British used cultural hegemony and manufactured consent to rule over India."},
      {text:"English literature appeared on the curriculum of the colonies long before it was institutionalised at home. As early as the 1820s, while the classical curriculum still held in England, English as the study of culture rather than of language already had a secure place in the British Indian curriculum.", pen:"Education in the colonies first. Its success there resulted in it being introduced in England."},
      {text:"A policy of religious neutrality prevented British officials from running a religious curriculum in India of the kind taught in English parish and charity schools, and so fresh pressure fell on a not yet fully formed discipline, English literature, to perform the functions that the church performed at home.", pen:"Found that literature can educate the masses, instead of religious study."},
      {text:"The English literary text, she writes, functions as a surrogate Englishman in his highest and most perfect state, and becomes a mask for economic exploitation, camouflaging the material activity of the coloniser so completely that Charles Trevelyan could claim Indians formed a higher idea of the British nation through its books than through meeting any of its people.", pen:"The mask of conquest: the ideology, a false consciousness, and how power actually operates. The self-presentation was of a superior person, which was simply not true, since in reality he was the subjugator."},
      {text:"She criticises Bruce McCully's account of English education as the origin of Indian nationalism, arguing that it treats the outcome as an accident and so never has to ask what the British actually intended by introducing the subject.", pen:"The effect of British education was political emancipation, but it was an unintended consequence. The point of historical criticism here is to call out the claim that Indian independence only happened because the British allowed for it through education."}
    ],
    response:"This came second on the course, straight after Young, and it is the book whose name I later found myself writing into the margin of McLuhan, because once you have read it you cannot stop asking whether this is a case of the medium being the message, and I think it is. The lesson of the colonial classroom was never in the texts on its syllabus, it was in the fact of the syllabus. What I kept writing in the margins was the present tense, because hegemony of this kind is not only historical, and the films we watch and the censorship we accept are versions of the same thing. The uncomfortable part, which Poduval then makes worse, is that the shape of that syllabus has not gone anywhere, and I am studying inside it. I have marked one line to ask about in class, where she says the response of the colonised is in fact irrelevant to her book, because I am not sure whether that is a limit she is admitting to or one she is defending.",
    slot:""
  },
  {
    id:"poduval", drive:"https://drive.google.com/file/d/1JQ4GBBhBqoORgMiPa9rk09bM8cLTkgXZ/view",

    what:"Poduval writes this essay about a year after finishing his MA. In Cochin he was, by his own account, in love with Shakespeare and Milton, topped his class and got the fellowship, and then he arrived at CIEFL in Hyderabad and ran straight into what people were then calling the crisis in English studies, after which all the questions were different. What is literature doing in a society organised around caste and cultural capital? What was his own success in the subject actually made of? He does not conclude that English should be scrapped. He concludes that it should be read from the margin, and he explains what that means.",
    passages:[
      {text:"He describes the words-on-the-page, “apolitical” way of reading he'd been trained in, and the moment it stood revealed as tools from the colonial kitbag.", pen:"The word-on-page apolitical approach is reinforcing an invisible ideology."},
      {text:"An Indian department studying English is doubly marginal, he says, neither “Western” nor “Indian”. And that awkward position is exactly what lets it read both sides critically.", pen:"Doubly marginal?? An Indian department studying English from under the centre."},
      {text:"Using Bourdieu, he shows caste working like inherited capital in the classroom. The students who do badly aren't slow; it's that “merit” is defined as reproducing the prescribed material in the acceptable style.", pen:"Social dissymmetry → a fundamental disbalance. Caste and merit."},
      {text:"The question he keeps returning to: should English studies continue in India at all? And the answer that comes straight back: can they be abandoned?", pen:"Should English be not taught anymore?"}
    ],
    response:"This is Young's chapter all over again, except this time it is somebody sitting more or less where I am sitting. The canon did not arrive in Bengaluru as a neutral reading list, it arrived as a syllabus designed to produce colonial subjects, and Poduval is the first writer on this course who admitted that out loud and then did not quit the subject. His idea of a bicameral approach, preparing students for the job market that actually exists while at the same time giving them the mindset to change it, is more or less the arrangement I have made with this degree, since I am doing English and Digital Humanities while running a small business at the same time, and I think he would understand that. The section on caste and merit was the hardest to sit with, because I could see a version of it in our own classroom, in who speaks first, whose English gets nodded at and who goes quiet, and I do not have a clean answer to that. I only know that I noticed it more after reading him.",
    slot:""
  },
  {
    id:"whatistext", drive:"https://drive.google.com/file/d/1Y3C60dXoLTAU5QA8Hp7aWZ6ceFwmxuQD/view",
    author:"Terry Eagleton",
    title:"“Introduction: What is Literature?”, from Literary Theory: An Introduction",
    year:"Blackwell, 1983, pp. 1–16",
    note:"every definition of literature, tried and knocked down in turn",
    what:"Eagleton opens his book by trying out every definition of literature he can think of and knocking each one down. Literature is not simply imaginative writing, because seventeenth-century English literature takes in Bacon's essays and Donne's sermons, and nineteenth-century literature includes Lamb but not Bentham, Macaulay but not Marx, Mill but not Darwin or Spencer. It is not language made strange, because what counts as strange depends entirely on the reader and the moment. It is not non-pragmatic writing, since that is a fact about how someone reads rather than about the text. What he is left with is that literature is whatever writing a society values highly, that such value judgements are historically variable, and that they are tied to ideology.",
    passages:[
      {text:"The first definition, imaginative writing as opposed to fact, collapses quickly. Seventeenth-century English literature includes essays, sermons and spiritual autobiography, while Superman comics and Mills and Boon novels are fiction and are not generally called literature.", pen:"What determines literature to be the way it is right now?"},
      {text:"The Russian Formalists offer a second definition: literature as organised violence committed on ordinary speech. If someone at a bus stop murmurs a line of Keats at you, you know at once that you are in the presence of the literary, because the words are in excess of their abstractable meaning.", pen:"Dance is a form of defamiliarisation, a way of discussing a simple idea. Poetry works the same way."},
      {text:"Devices such as rhythm, imagery and narrative technique share an estranging effect: ordinary language is intensified and twisted until habitual responses are refreshed and the world becomes perceptible again. Most of the time we breathe air without noticing it.", pen:"Used to explain what the author is trying to put through, in a way that makes the understanding better."},
      {text:"But to spot a deviation you must first identify the norm it deviates from, and there is no single normal language. A word may be poetic in Brighton and ordinary speech in Barnsley, so literariness turns out to be a relation between discourses rather than a property of a text.", pen:""},
      {text:"He tests this on a London Underground notice, Dogs must be carried on the escalator, and shows that it can be read as poetry if you are willing to read it that way, and then imagines a late-night drunk reading the same sign and muttering how true, which is closer still to what people do when they call something literature.", pen:"A complete flip. It depends on how someone reads the text, not on the text."},
      {text:"His conclusion is that literature works like the word weed. A weed is not a kind of plant, it is any plant a gardener does not want. Literature is any writing that somebody values highly, which makes it a functional term and not an essential one, and makes the canon a construct fashioned by particular people for particular reasons at a particular time.", pen:"The crux."},
      {text:"He closes with I. A. Richards's Practical Criticism experiment of 1929, where undergraduates graded poems with the titles and authors removed, and notes that what is really striking is not how variable the judgements were but how tight a consensus of unconscious values sat underneath them.", pen:""}
    ],
    response:"This was the reading I expected to be easy and it was not. I thought I would be handed a definition and could then get on with the course. Instead he takes every definition I would have offered, including the ones I did not know I was carrying around, and shows that none of them holds. The escalator sign annoyed me at first and then would not leave me alone, because it moves the whole question away from the text and onto the reader, which is the same move Barthes makes from a different direction. My note at the end of the chapter is the summary I would still give: there is no essence of literature, it is not a stable object, it is a label certain societies attach to certain writings. By that point I had stopped asking what literature is and started asking who decided, which I think is where the course wanted me to end up.",
    slot:""
  },
  {
    id:"barthes", drive:"https://drive.google.com/file/d/1m8pZ84tu1X_QbaqjviAl72vUMZJTu1w3/view",
    author:"Roland Barthes",
    title:"“From Work to Text”",
    year:"Image Music Text, trans. Stephen Heath, Fontana Press, 1977, pp. 155–64",
    note:"seven propositions on the difference between an object and a field",
    what:"As far as I could follow it, Barthes says that our idea of language has shifted and so the thing we study has to shift with it. The work is an object, you can hold it, shelve it, put an author's name on it and sell it. The Text is not an object at all but something closer to a field or a process, something that only exists while someone is reading it, and it does not belong to anybody. He sets this out in seven propositions, method, genres, signs, plurality, filiation, reading and pleasure, which I numbered in the margin because I needed something to hold on to.",
    passages:[
      {text:"The work takes up space on a shelf. The Text is held in language and only exists in the movement of a discourse.", pen:"method / genres / signs / plurality / filiation / reading / pleasure"},
      {text:"The Text keeps deferring the signified. Its logic isn't “what does this mean” but association, contiguity, things carried over from elsewhere.", pen:"Delaying the signified indefinitely."},
      {text:"The work is caught in filiation: the author is its father and owner. Copyright, Barthes notes, only really dates from the French Revolution. The Text reads without the Father's signature on it.", pen:"resistance to writing in the conventional way"},
      {text:"Reading a work is consumption. The Text wants collaboration, the way a score needs a performer to finish it. Its pleasure is jouissance, pleasure without separation.", pen:"plaisir v/s jouissance. Jouissance is pleasure without separation."}
    ],
    response:"The first time through I understood maybe a third of it. What eventually clicked was the section on filiation, the idea that a text can be read without its father, and once that landed roughly half the course rearranged itself around it, the canon in Young, the colonial syllabus in Poduval and Viswanathan, the internet in Carr, all of them turned out to be the same argument about who owns the meaning of a text and what reading becomes when the answer is nobody. The sentence I never fully cracked is the one where he says the work is the imaginary tail of the Text. I have read it maybe ten times. My best guess at the moment is that the book we hold in our hands is only the visible end of something that is mostly happening in language, but I am holding that guess loosely.",
    slot:""
  },
  {
    id:"death", drive:"https://drive.google.com/file/d/1-uBv2zYjaCRqAMZ69WbzR37Xy6N_E5fN/view",
    author:"Roland Barthes",
    title:"“The Death of the Author”",
    year:"Image Music Text, trans. Stephen Heath, Fontana Press, 1977, pp. 142–48",
    note:"the reader is born, and the author has to go",
    what:"Barthes begins with a sentence from Balzac's Sarrasine, spoken about a castrato disguised as a woman, and asks who is actually saying it: the hero, Balzac the man, Balzac the author, universal wisdom. His answer is that we can never know, because writing is the destruction of every voice and every origin. From there he argues that the Author is a modern invention, that the text is a fabric of quotations with no original, and that the place where all of it is finally gathered is not the author but the reader.",
    passages:[
      {text:"Who speaks the Balzac sentence? The question has no answer, because once a fact is recounted for its own sake rather than to act on reality, the voice loses its origin, the author enters into his own death, and writing begins.", pen:"The author speaking, the narrator speaking, the character speaking: a loaded question of who really is the author or creator."},
      {text:"In ethnographic societies narrative is never taken on by a person but by a mediator, a shaman or a reciter, whose performance can be admired but never his genius. The author is a modern character, produced as European society emerged from the Middle Ages and discovered the prestige of the individual.", pen:"The notion of an author is a modern concept."},
      {text:"The Author is conceived as the past of his own book, standing to it as a father does to a child, living before it and feeding it. The modern scriptor is born at the same moment as the text, and every text is written eternally here and now.", pen:"The author is the before of their work, the author is the past. The scriptor is ephemeral. The performer distances himself from the performance, and every day you come back and read it the scriptor changes."},
      {text:"A text is not a line of words releasing a single theological meaning from an Author-God, but a space in which several writings are married and contested, none of them original. It is a fabric of quotations drawn from a thousand sources of culture.", pen:"Intertextuality. Language is a social construction, which means it can also be deconstructed, and anything written in language can be deconstructed."},
      {text:"To give a text an Author is to impose a brake on it, to supply a final signified and close the writing. In multiple writing everything is to be disentangled and nothing deciphered; the space of writing is to be traversed, not pierced.", pen:""},
      {text:"There is a site where the multiplicity of a text is gathered, and it is not the author but the reader, who holds all the traces of which the writing is made. The unity of a text lies not in its origin but in its destination, and so the birth of the reader must be requited by the death of the Author.", pen:"The author comes back to the text as a reader only."}
    ],
    response:"We read this straight after From Work to Text and it is the same argument made from the other end. If the work has a father, as the first essay says, then this one is about what happens when the father leaves the room, and the answer is that the reader inherits everything. The sentence I kept turning over is that every text is written eternally here and now, because it means the thing I am holding is not a message somebody sent me in 1968 but something that only exists while I am reading it, which is also why my own margins kept saying the scriptor changes. The part I liked most is small and easy to miss: Barthes points out that in oral cultures nobody looked for an author at all, only a performer, and that the author is a modern invention produced by a particular society at a particular moment. That put the whole course in one line for me, because if the author can be invented then the author can also be got rid of, and neither event has anything to do with the text itself.",
    slot:""
  },
  {
    id:"mcluhan", drive:"https://drive.google.com/file/d/1NZAcWsHe-bb6Rliq8qdH3iZkkmE1ZUaK/view",
    author:"Marshall McLuhan",
    title:"“The Medium is the Message”, from Understanding Media",
    year:"Understanding Media, The MIT Press, 1964, pp. 1–18",
    note:"the content of any medium is another medium",
    what:"McLuhan's first chapter argues that the message of any medium is the change in scale, pace or pattern it brings into human life, regardless of what content it happens to carry. The electric light is a medium with no content at all. The message of the railway is not the freight but the new kinds of cities. Print homogenised France and produced a revolution, whereas England's oral common-law tradition resisted it. He even reads Forster's A Passage to India as a parable of literate, sequential Western reason failing to cope with an oral, inclusive field.",
    passages:[
      {text:"The content of writing is speech, the written word is the content of print, print is the content of the telegraph. The “content” of any medium is always another medium.", pen:"Technology itself is the message. Written during the invention and introduction of technology into households."},
      {text:"De Tocqueville could read the message of print because he stood outside it. Print, once it saturated France in the 1700s, made Frenchmen the same kind of people from north to south.", pen:"Has digital media achieved cultural saturation?"},
      {text:"Sarnoff's line that technology is neither good nor bad, only its use, McLuhan calls “the voice of the current somnambulism.” Try the sentence with apple pie, smallpox, firearms. It falls apart every time.", pen:"Unbiased? Somnambulism: the sleep disorder where a person performs complex actions."},
      {text:"IQ tests assume uniform, continuous habits are intelligence, which quietly eliminates the ear-man and the tactile man. A typographic bias nobody can see from inside it.", pen:"A connection to Satish Poduval."},
      {text:"Technology's effects don't happen at the level of opinions. They alter our sense ratios steadily and without resistance.", pen:"Can be translated to AI. It is the medium that determines how we interact with society itself."}
    ],
    response:"This is the reading where I started writing other readings into the margins, Masks of Conquest on the very first page and Poduval next to the passage on IQ tests, which I think means this was the point where the course stopped being a list of separate texts for me and started being one argument. McLuhan gave me the sentence that the whole of this portfolio hangs on, that the content of a medium is always another medium, because it means the question is never only what a text says but what its medium is doing to the reader who holds it. My note on the last page asks whether this translates to AI. I think it does, and I think it is probably the most urgent version of the question for people my age. The example that made it land in class was reels. Nobody argued that any single video was changing them. Everybody admitted that the format was.",

const app=document.getElementById("app");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function setNav(k){document.querySelectorAll(".top a[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===k))}
function foot(){return `<div class="foot">Email - rizwanbinaseef@gmail.com<br>BA English and Digital Humanities, first year, 2633131</div>`}

function viewHome(){
  setNav("home");
  return `
  <h1 class="course">Text and Textualities.</h1>
  <p class="small soft">Submitted for Text and Textualities, first semester, BA English and Digital Humanities, Christ (Deemed to be University), Bengaluru. Rizwan Aseef, register number 2633131. Faculty: Prof. Renu Elizabeth.</p>
  <h2>About the course</h2>
  <p>Text and Textualities is a first-semester course in the BA in English and Digital Humanities, and it deals with, as the name suggests, the question of what a text is. Now on the first day I honestly assumed that this would be a fairly short question with a fairly short answer, something like a text is anything that is written down, and that we would then move on to actually reading texts. That is not what happened. I knew that a course about texts obviously belongs in a literature degree, what I did not expect was how deep it would go and how much of it would be about things that did not look like literature at all. We started, not with any text, but with the subject of English itself, where it came from as a discipline, what it was originally built to do and how it looks when you study it from an Indian classroom instead of a British one, and only after that did we come to the theory of the text as such, Barthes and his distinction between the work and the Text, and Eagleton, who spends an entire chapter refusing to define literature and then more or less admits that it cannot be done. The second half of the course followed the text through its different media, from oral cultures to the manuscript, from the manuscript to print and from print to the screen, and here McLuhan and Carr were used to ask what each of these media does to the person who is reading in it, whether they are aware of it or not. By the end of the semester the question was no longer what is a text but who decided what counts as one and through which medium, which is a very different question and, I believe, a more useful one.</p>
  <p>Unit 1 framed all of this through the idea of transformative learning, which in short means that the aim of the course was not to give us more information about texts but to disturb an assumption we already had about them and make us look at it properly. Every reading in the course was done on paper, on a photocopy, with a pen, and I have come to think this was deliberate, because it meant that whatever got disturbed left a mark somewhere. Those annotated photocopies are what this portfolio is made of. On this site I will be discussing the readings themselves, my responses to them and what I ended up writing in their margins, which in some cases surprised me more than the readings did. The last section is my reflective essay on the course as a whole.</p>
  <h2>About me</h2>
  <p>My name is Rizwan Aseef and I am 19 years old, currently in my first year of the BA in English and Digital Humanities at Christ Deemed-to-be University, BGR campus. I came into this degree from a commerce background, which is not the usual route, and along with the degree I run a small marketing agency with a friend, so a good part of my week is spent reading things that are not literature at all, briefs, captions, analytics and so on. Before this semester most of my reading was for pleasure and most of it was on a phone. I mention this because it turned out to be relevant to the course: I arrived expecting Text and Textualities to be the part of the week where I read something and then said whether or not I liked it, and it turned out instead to be the course that made me question why I read the way I read in the first place.</p>
  <p>In this portfolio, I will be discussing my understanding and experience of this course. The readings appear in the order the course took them, each with my response to the text, the passages I marked and the scan of my own annotated copy, which you can scroll through on the page itself.</p>
  <ul class="areas">
    <li><a href="#/readings">The readings</a></li>
  </ul>
  <p class="note">The scans on this site are my own annotated photocopies of the course readings. The texts belong to their authors and publishers; full references are given at the end of each page.</p>
  ${foot()}`;
}

function cite(r){
  const C={
    barthes:"Barthes, Roland. “From Work to Text.” <i>Image Music Text</i>, translated by Stephen Heath, Fontana Press, 1977, pp. 155–64.",
    carr:"Carr, Nicholas. “The Juggler's Brain.” <i>The Shallows: How the Internet Is Changing the Way We Think, Read and Remember</i>, Atlantic Books, 2010, pp. 115–20, 126–29.",
    whatistext:"Eagleton, Terry. “Introduction: What is Literature?” <i>Literary Theory: An Introduction</i>, Blackwell, 1983, pp. 1–16.",
    death:"Barthes, Roland. “The Death of the Author.” <i>Image Music Text</i>, translated by Stephen Heath, Fontana Press, 1977, pp. 142–48.",
    mcluhan:"McLuhan, Marshall. “The Medium is the Message.” <i>Understanding Media: The Extensions of Man</i>, The MIT Press, 1964, pp. 1–18.",
    poduval:"Poduval, Satish. “To Be in Eng. Lit., Now That… The Voyage Out.” <i>Subject to Change: Teaching Literature in the Nineties</i>, Orient Blackswan, 1998, pp. 143–59.",
    viswanathan:"Viswanathan, Gauri. Introduction. <i>The Masks of Conquest</i>, Oxford UP, 1989, pp. 1–21.",
    nayar:"Nayar, Pramod K. “New Media, Digitextuality and Public Space: Reading ‘Cybermohalla’.” <i>Postcolonial Text</i>.",
    young:"Young, Tory. “Reading: The Discipline of English.” <i>Studying English Literature: A Practical Guide</i>, Cambridge UP, 2008, pp. 24–26."
  };
  return C[r.id]||"";
}

function readingBlock(r,n){
  return `
  ${r.drive?`<div class="scan"><iframe src="${r.drive.replace('/view','/preview')}" title="Annotated scan of ${esc(r.title)}" loading="lazy" allow="autoplay"></iframe></div>
  <p class="small soft">My annotated copy. Scroll through it here or <a href="${r.drive}" target="_blank" rel="noopener">open it full size</a>.</p>`:""}
  <h2 id="${r.id}">${n}. ${esc(r.title)}</h2>
  <p class="small soft">${esc(r.author)}, ${esc(r.year)}</p>
  ${r.what?`<p>${esc(r.what)}</p>`:""}
  ${r.response?`<p>${esc(r.response)}</p>`:""}
  ${r.passages.length?`<div class="sheet"><div class="src">${r.passages.some(p=>p.pen)?"Passages I marked, with what I wrote beside them":"Passages I marked"}</div>
    ${r.passages.map(p=>`<div class="passage"><p>${esc(p.text)}</p>${p.pen?`<div class="mnote pen">${esc(p.pen)}</div>`:""}</div>`).join("")}
  </div>`:""}`;
}

function viewReadings(){
  setNav("readings");
  return `
  <h1>The readings</h1>
  <p class="note">(In the order the course took them. The scans below are my own annotated photocopies. The texts belong to their authors.)</p>
  ${READINGS.map((r,n)=>readingBlock(r,n+1)).join("<hr>")}
  <div class="label">References</div>
  ${READINGS.map(r=>`<p class="small">${cite(r)}</p>`).join("")}
  ${foot()}`;
}

function render(){
  const h=location.hash.replace(/^#\/?/,"");
  const [a,b]=h.split("/");
  let html;
  if(!a) html=viewHome();
  else if(a==="readings") html=viewReadings();
  else if(a==="reading"){ html=viewReadings(); }
  else html=viewHome();
  app.innerHTML=html;
  if(a==="reading"&&b){const el=document.getElementById(b); if(el){el.scrollIntoView(); return;}}
  window.scrollTo({top:0});
}
window.addEventListener("hashchange",render); render();
